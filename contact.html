<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AutoNova Motors | Contact Us</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="site-header glass">
    <div class="container nav-wrap">
      <a class="brand" href="home.html">AutoNova</a>
      <button class="menu-toggle" aria-label="Toggle menu">☰</button>
      <nav class="nav-links">
        <a href="home.html">Home</a>
        <a href="about.html">About Us</a>
        <a href="services.html">Services</a>
        <a class="active" href="contact.html">Contact Us</a>
      </nav>
    </div>
  </header>

  <main class="container section">
    <div class="page-hero reveal">
      <h1>Contact Us</h1>
      <p>Let’s find the perfect car deal for you. Reach out today.</p>
    </div>
    <form class="contact-form reveal">
      <input type="text" placeholder="Full Name" required>
      <input type="email" placeholder="Email Address" required>
      <input type="tel" placeholder="Phone Number">
      <textarea rows="5" placeholder="Tell us what you're looking for..."></textarea>
      <button type="submit" class="btn btn-primary">Send Message</button>
    </form>
  </main>

  <footer class="site-footer"><div class="container"><p>© 2026 AutoNova Motors. All rights reserved.</p></div></footer>
  <script src="script.js"></script>
</body>
